name: Website

# Publishes the website (start page, privacy policy, help & contact, imprint) on GitHub Pages.
# Runs only when started by hand: Actions → Website → Run workflow. Before the first run,
# switch on GitHub Pages with "GitHub Actions" as the source (Settings → Pages) and fill in
# src/config/legal.json and site/site.config.json – the build refuses to publish a draft.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment), like in ci.yml.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the website (fails while provider details are missing)
        run: npm run site:build -- --release

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist-site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
